<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TRINITY</title>

    <!-- WINDOWS 98 BASE STYLES -->
    <link rel="stylesheet" href="98.css-main/dist/98.css" />

    <!-- TRINITY STYLES / DARK THEME OVERRIDES -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- TOP WEBSITE NAVIGATION -->

    <header class="topbar">

        <div class="logo">
            TRINITY
        </div>

        <nav>
            <a href="members.html">Members Only</a>
            <a href="projects.html">Projects</a>
            <a href="radio.html">Radio</a>
            <a href="about.html">About</a>
            <a href="tests.html">Tests</a>
        </nav>

    </header>


    <!-- DESKTOP -->

    <main class="home" id="desktop">

        <!--
            FIRST WINDOWS 98 WINDOW

            This is currently our test window.

            Eventually JavaScript will create separate windows
            for Projects, Radio, Tests, About, and Members Only.
        -->

        <div
            class="window trinity-window"
            id="desktopWindow"
            data-window="projects"
        >

            <!-- WINDOWS 98 TITLE BAR -->

            <div
                class="title-bar"
                id="desktopWindowTitlebar"
            >

                <div
                    class="title-bar-text"
                    id="desktopWindowTitle"
                >
                    TRINITY - PROJECTS
                </div>

                <!--
                    98.css renders the actual Windows 98
                    minimize, maximize, and close glyphs.
                -->

                <div class="title-bar-controls">

                    <button
                        id="windowMinimize"
                        aria-label="Minimize"
                    ></button>

                    <button
                        id="windowMaximize"
                        aria-label="Maximize"
                    ></button>

                    <button
                        id="windowClose"
                        aria-label="Close"
                    ></button>

                </div>

            </div>


            <!-- WINDOWS 98 WINDOW BODY -->

            <div
                class="window-body trinity-window-body"
                id="desktopWindowContent"
            >

                <h2>PROJECTS</h2>

                <p>
                    COMING SOON
                </p>

            </div>

        </div>

    </main>


    <!-- START MENU -->

    <div
        class="start-menu"
        id="startMenu"
    >

        <div class="start-menu-mask">

            <div class="start-menu-inner">

                <div class="start-menu-sidebar">
                    <span>TRINITY</span>
                </div>

                <div class="start-menu-items">

                    <button
                        class="start-menu-item"
                        data-window="projects"
                    >
                        Projects
                    </button>

                    <button
                        class="start-menu-item"
                        data-window="radio"
                    >
                        Radio
                    </button>

                    <button
                        class="start-menu-item"
                        data-window="tests"
                    >
                        Tests
                    </button>

                    <div class="start-menu-divider"></div>

                    <button
                        class="start-menu-item"
                        data-window="about"
                    >
                        About
                    </button>

                    <button
                        class="start-menu-item"
                        data-window="members"
                    >
                        Members Only
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- WINDOWS TASKBAR -->

    <div class="win-taskbar">

        <!-- START BUTTON -->

        <button
            class="win-button start-button"
            id="startButton"
        >

            <img
                class="start-icon-img"
                src="assets/windows-start.png"
                alt=""
                width="16"
                height="16"
            />

            <strong>Start</strong>

        </button>


        <div class="taskbar-divider"></div>


        <!--
            PERMANENT TRINITY TASKBAR BUTTON

            This stays separate from application windows.
        -->

        <button
            class="win-button task-button trinity-task-button active"
            id="trinityTaskButton"
        >

            <img
                class="task-icon-img"
                src="assets/trinity-logo.png"
                alt=""
                width="16"
                height="16"
            />

            <span>
                TRINITY
            </span>

        </button>


        <!--
            APPLICATION TASKBAR BUTTONS

            JavaScript will add buttons here later.

            Example:

            [ Start ] [ TRINITY ] [ Projects ] [ Radio ]
        -->

        <div
            class="taskbar-apps"
            id="taskbarApps"
        ></div>


        <div class="taskbar-spacer"></div>


        <!-- CLOCK -->

        <div class="taskbar-clock">

            <img
                class="clock-icon"
                src="assets/win-connection-status.png"
                alt=""
                width="16"
                height="16"
            />

            <span id="taskbarClock">
                12:00 PM
            </span>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
