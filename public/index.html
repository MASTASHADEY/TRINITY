<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRINITY</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header class="topbar">
        <div class="logo">TRINITY</div>

        <nav>
            <a href="#">Members Only</a>
            <a href="#">Projects</a>
            <a href="#">Radio</a>
            <a href="#">About</a>
            <a href="#">Tests</a>
        </nav>
    </header>

    <main class="home"></main>

    <div class="win-taskbar">

        <button class="win-button start-button">
            <img class="start-icon-img" src="assets/windows-start.png" alt="" />
            <strong>Start</strong>
        </button>

        <div class="taskbar-divider"></div>

        <button class="win-button task-button active">
            <img class="task-icon-img" src="assets/trinity-logo.png" alt="" />
            <span>TRINITY</span>
        </button>

        <div class="taskbar-spacer"></div>

        <div class="taskbar-clock">
            <img class="clock-icon" src="assets/win-connection-status.png" alt="" />

            <span id="taskbarClock">
                12:00 PM
            </span>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
